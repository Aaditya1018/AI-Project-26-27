services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: safestack-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_PROVIDER=offline
    volumes:
      - ./backend/storage:/app/backend/storage
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: safestack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
